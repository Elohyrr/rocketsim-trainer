[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/Elohyrr/rocketsim-trainer"

[workspace.dependencies]
rocketsim_rs = { version = "=0.37.0", default-features = false, features = ["serde_utils"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
