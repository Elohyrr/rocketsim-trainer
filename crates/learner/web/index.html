<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1318">
<title>Clips du bot — rocketsim-trainer</title>
<style>
  :root { --bg:#0f1318; --panel:#171c23; --line:#2a323d; --fg:#e6e9ee; --dim:#8b95a3; --blue:#3b8cff; --orange:#ff8a2b; --acc:#5ad1a0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.35 system-ui,sans-serif; overflow:hidden; }
  button,select { font:inherit; color:var(--fg); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; min-height:40px; cursor:pointer; }
  button:active { background:var(--line); }
  button.on { border-color:var(--acc); color:var(--acc); }
  #app { display:flex; flex-direction:column; height:100%; height:100dvh; }
  header { display:flex; align-items:center; gap:10px; padding:8px 12px; padding-top:max(8px,env(safe-area-inset-top)); background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header small { color:var(--dim); font-weight:normal; }
  main { position:relative; flex:1; min-height:0; }
  #view { position:absolute; inset:0; touch-action:none; }
  #view canvas { display:block; width:100%; height:100%; }
  #hud { position:absolute; left:8px; top:8px; right:8px; pointer-events:none; display:flex; justify-content:space-between; gap:8px; font-size:13px; text-shadow:0 1px 3px #000; }
  #hud .b { background:#0009; border-radius:6px; padding:4px 8px; }
  #hud .g { display:flex; flex-direction:column; gap:4px; align-items:flex-start; }
  #hud .g.r { align-items:flex-end; }
  .gauge { display:flex; align-items:center; gap:6px; background:#0009; border-radius:6px; padding:4px 8px; font-variant-numeric:tabular-nums; }
  .gauge .bar { display:inline-block; width:64px; height:9px; border:1px solid #fff8; border-radius:2px; overflow:hidden; }
  .gauge .bar i { display:block; height:100%; width:0; }
  .gauge.blue .bar i { background:var(--blue); } .gauge.orange .bar i { background:var(--orange); }
  .gauge { flex-wrap:wrap; }
  .gauge b { min-width:2.2em; text-align:right; }
  .spd { flex-basis:100%; font-size:12px; line-height:1.25; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .spd b { min-width:0; font-size:15px; } .spd small { opacity:.7; font-size:10.5px; }
  .gauge.blue .spd b { color:#7db4ff; } .gauge.orange .spd b { color:#ffb070; }
  .ss { color:#ff5b5b; font-weight:700; font-size:11px; }
  #ballhud { margin-top:4px; background:#0009; border-radius:6px; padding:4px 8px; font-size:12px; font-variant-numeric:tabular-nums; }
  #ballhud b { font-size:15px; } #ballhud small { opacity:.7; font-size:10.5px; }
  #adv { position:absolute; left:8px; bottom:8px; background:#000a; border-radius:6px; padding:4px 8px; font:11.5px/1.35 ui-monospace,monospace; pointer-events:none; white-space:pre; display:none; max-width:calc(100% - 16px); overflow:hidden; text-shadow:0 1px 3px #000; }
  #inp { position:absolute; right:8px; bottom:8px; display:none; flex-direction:column; gap:6px; align-items:flex-end; pointer-events:none; font-size:11.5px; text-shadow:0 1px 3px #000; }
  .ip { background:#000b; border-radius:6px; padding:5px 8px; width:210px; font-variant-numeric:tabular-nums; }
  .ip.agent { outline:1px solid #fffa; }
  .ip .nm { font-weight:600; margin-bottom:2px; } .ip.blue .nm { color:#7db4ff; } .ip.orange .nm { color:#ffb070; }
  .ip .r { display:flex; align-items:center; gap:6px; height:15px; }
  .ip .r span:first-child { width:46px; color:var(--dim); }
  .ip .ax { position:relative; flex:1; height:7px; background:#ffffff22; border-radius:3px; }
  .ip .ax::after { content:''; position:absolute; left:50%; top:-1px; width:1px; height:9px; background:#fff8; }
  .ip .ax i { position:absolute; top:0; height:100%; background:var(--acc); border-radius:3px; }
  .ip .ax i.neg { background:#ffb347; }
  .ip .bt { display:flex; gap:4px; margin-top:3px; }
  .ip .bt b { flex:1; text-align:center; padding:2px 0; border-radius:4px; background:#ffffff18; color:#fff6; font-size:11px; }
  .ip .bt b.on { color:#000; } .ip .bt b.j.on { background:#fff; } .ip .bt b.bo.on { background:#ffd23f; } .ip .bt b.hb.on { background:#ff6b6b; }
  .ip .ev { min-height:21px; margin-top:4px; padding:3px 6px; border-radius:5px; font-weight:700; font-size:13px; text-align:center; background:#ffffff10; color:#fff5; }
  .ip .ev.flip { background:#ff3b6b; color:#fff; } .ip .ev.dj { background:#3bd1ff; color:#000; } .ip .ev.cancel { background:#b266ff; color:#fff; }
  .mk.fl { background:#ff3b6b; height:12px; }
  #advbtn.on { background:var(--blue); color:#fff; }
  .gauge.agent { outline:1px solid #fffa; }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); text-align:center; padding:20px; pointer-events:none; }
  #ctl { background:var(--panel); border-top:1px solid var(--line); padding:8px 12px; padding-bottom:max(8px,env(safe-area-inset-bottom)); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row + .row { margin-top:8px; }
  #bar { position:relative; flex:1; min-width:120px; }
  #seek { width:100%; margin:0; height:32px; }
  .chip { display:inline-block; background:#ffffff1a; border-radius:9px; padding:1px 7px; margin:0 4px 2px 0; font-size:.85em; }
  .chip.combo { background:var(--orange); color:#000; }
  .mk { position:absolute; top:0; width:2px; height:9px; background:#6cf; pointer-events:none; }
  #trig { position:absolute; top:0; width:2px; height:6px; background:var(--orange); pointer-events:none; display:none; }
  #time { font-variant-numeric:tabular-nums; color:var(--dim); min-width:84px; text-align:right; }
  .grow { flex:1; }
  #list { position:absolute; inset:0; background:var(--bg); z-index:5; display:none; flex-direction:column; }
  #list.open { display:flex; }
  #filters { display:flex; gap:6px; padding:10px 12px; overflow-x:auto; flex:none; border-bottom:1px solid var(--line); }
  #filters button { white-space:nowrap; padding:6px 10px; min-height:36px; }
  #sortrow { display:flex; align-items:center; gap:8px; padding:8px 12px; color:var(--dim); flex:none; }
  #items { overflow-y:auto; flex:1; -webkit-overflow-scrolling:touch; }
  .item { display:flex; justify-content:space-between; gap:8px; padding:12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:active,.item.cur { background:var(--panel); }
  .item b { font-weight:600; }
  .item span { color:var(--dim); font-size:13px; }
  #body { position:relative; flex:1; min-height:0; display:flex; }
  .wrap { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
  @media (min-width:900px) {
    #list { position:static; display:flex; width:340px; flex:none; border-right:1px solid var(--line); }
    #btnlist,#close { display:none; }
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const BLUE = 0x3b8cff, ORANGE = 0xff8a2b;
// Repère RocketSim (x, y, z haut ; ≈ cm) → three (x, y haut, -y) : rotation propre, but orange au fond.
const P = (x, y, z) => new THREE.Vector3(x, z, -y);

/* ---------- Terrain simplifié ---------- */
const HX = 4096, HY = 5120, HZ = 2044, GW = 893, GH = 643, GD = 880;
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e12);
scene.fog = new THREE.Fog(0x0b0e12, 9000, 22000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(-2000, 6000, 3000); scene.add(sun);
const camera = new THREE.PerspectiveCamera(55, 1, 20, 40000);
camera.position.set(0, 3800, 7600);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 300, 0); orbit.enableDamping = true; orbit.maxDistance = 16000; orbit.minDistance = 150;
orbit.maxPolarAngle = Math.PI * 0.499;

function line(pts, color, op = 1) {
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  return new THREE.Line(g, new THREE.LineBasicMaterial({ color, transparent: op < 1, opacity: op }));
}
(function buildField() {
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(HX * 2, HY * 2).rotateX(-Math.PI / 2),
    new THREE.MeshLambertMaterial({ color: 0x1d3a2b }));
  scene.add(floor);
  const wm = new THREE.MeshBasicMaterial({ color: 0x8fb4ff, transparent: true, opacity: 0.07, side: THREE.DoubleSide, depthWrite: false });
  const wall = (w, h, x, y, z, ry) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wm); m.position.set(x, y, z); m.rotation.y = ry; scene.add(m); };
  wall(HY * 2, HZ, -HX, HZ / 2, 0, Math.PI / 2); wall(HY * 2, HZ, HX, HZ / 2, 0, Math.PI / 2);
  for (const s of [-1, 1]) { // murs de fond avec l'ouverture du but
    const seg = (HX - GW);
    wall(seg, HZ, -(GW + seg / 2), HZ / 2, s * HY, 0); wall(seg, HZ, GW + seg / 2, HZ / 2, s * HY, 0);
    wall(GW * 2, HZ - GH, 0, GH + (HZ - GH) / 2, s * HY, 0);
  }
  const edge = 0x6f8fb8;
  scene.add(line([P(-HX, -HY, 0), P(HX, -HY, 0), P(HX, HY, 0), P(-HX, HY, 0), P(-HX, -HY, 0)], 0xffffff, 0.7));
  scene.add(line([P(-HX, -HY, HZ), P(HX, -HY, HZ), P(HX, HY, HZ), P(-HX, HY, HZ), P(-HX, -HY, HZ)], edge, 0.5));
  for (const [x, y] of [[-HX, -HY], [HX, -HY], [HX, HY], [-HX, HY]]) scene.add(line([P(x, y, 0), P(x, y, HZ)], edge, 0.5));
  scene.add(line([P(-HX, 0, 0.5), P(HX, 0, 0.5)], 0xffffff, 0.6));
  const circ = []; for (let i = 0; i <= 64; i++) circ.push(P(Math.cos(i / 64 * 6.2832) * 1000, Math.sin(i / 64 * 6.2832) * 1000, 0.5));
  scene.add(line(circ, 0xffffff, 0.6));
  for (const [s, col] of [[-1, BLUE], [1, ORANGE]]) { // buts (cadres) et surface de but
    const y0 = s * HY, y1 = s * (HY + GD);
    scene.add(line([P(-GW, y0, 0), P(-GW, y1, 0), P(GW, y1, 0), P(GW, y0, 0)], col));
    scene.add(line([P(-GW, y0, GH), P(-GW, y1, GH), P(GW, y1, GH), P(GW, y0, GH), P(-GW, y0, GH)], col));
    scene.add(line([P(-GW, y1, 0), P(-GW, y1, GH)], col)); scene.add(line([P(GW, y1, 0), P(GW, y1, GH)], col));
    scene.add(line([P(-1000, y0, 0.5), P(-1000, s * (HY - 1200), 0.5), P(1000, s * (HY - 1200), 0.5), P(1000, y0, 0.5)], col, 0.5));
    const net = new THREE.Mesh(new THREE.BoxGeometry(GW * 2, GH, GD), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.08, depthWrite: false }));
    net.position.set(0, GH / 2, -s * (HY + GD / 2)); scene.add(net);
  }
})();

/* ---------- Balle et voitures ---------- */
const ballMesh = new THREE.Group();
ballMesh.add(new THREE.Mesh(new THREE.IcosahedronGeometry(91.25, 2), new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.6, flatShading: true })));
ballMesh.add(new THREE.Mesh(new THREE.IcosahedronGeometry(92.5, 1), new THREE.MeshBasicMaterial({ color: 0x222222, wireframe: true })));
scene.add(ballMesh);
let ballPath = null;

function makeCar(blue, agent) {
  const col = blue ? BLUE : ORANGE, g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.5, emissive: agent ? col : 0x000000, emissiveIntensity: agent ? 0.35 : 0 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(118, 32, 84), mat); body.position.set(10, 8, 0); g.add(body);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(50, 22, 70), new THREE.MeshStandardMaterial({ color: 0x14181d, roughness: 0.4 })); cab.position.set(-10, 32, 0); g.add(cab);
  const nose = new THREE.Mesh(new THREE.BoxGeometry(10, 10, 60), new THREE.MeshBasicMaterial({ color: 0xffffff })); nose.position.set(70, 10, 0); g.add(nose);
  if (agent) {
    g.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(124, 40, 90)).translate(10, 8, 0), new THREE.LineBasicMaterial({ color: 0xffffff })));
    const cone = new THREE.Mesh(new THREE.ConeGeometry(30, 70, 4).rotateX(Math.PI), new THREE.MeshBasicMaterial({ color: 0xffe14d })); cone.position.set(0, 140, 0); g.add(cone);
  }
  const fl = new THREE.Mesh(new THREE.ConeGeometry(18, 90, 8).rotateZ(Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffa31a }));
  fl.position.set(-110, 8, 0); fl.visible = false; g.userData.flame = fl; g.add(fl);
  const core = new THREE.Mesh(new THREE.ConeGeometry(9, 60, 8).rotateZ(Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xfff2a8 }));
  core.position.set(-95, 8, 0); fl.add(core); core.position.set(5, 0, 0); g.userData.core = core;
  g.matrixAutoUpdate = false;
  scene.add(g); return g;
}
let cars = [], gaugeEls = [];

/* ---------- Boosts au sol ---------- */
const PADCOL = 0xffb62e, PADOFF = 0x4a4f57;
let pads = []; // { mesh, big, flash, x }
const padGroup = new THREE.Group(); scene.add(padGroup);
function buildPads(t) {
  padGroup.clear(); pads = [];
  const pp = t.pads; if (!pp || !pp.big || !pp.big.length) return;
  const small = new THREE.CylinderGeometry(70, 70, 8, 20), big = new THREE.CylinderGeometry(120, 120, 18, 24);
  const orb = new THREE.SphereGeometry(75, 14, 10);
  for (let i = 0; i < pp.big.length; i++) {
    const g = new THREE.Group(), isBig = pp.big[i];
    const mat = new THREE.MeshBasicMaterial({ color: PADCOL, transparent: true });
    const disc = new THREE.Mesh(isBig ? big : small, mat); disc.position.y = isBig ? 9 : 4; g.add(disc);
    let sph = null;
    if (isBig) { sph = new THREE.Mesh(orb, mat); sph.position.y = 130; g.add(sph); }
    const ring = new THREE.Mesh(new THREE.RingGeometry(1, 1.25, 28).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide }));
    ring.position.y = 12; g.add(ring);
    g.position.copy(P(pp.pos[i * 3], pp.pos[i * 3 + 1], pp.pos[i * 3 + 2]));
    g.position.y = 0; // posés au sol
    padGroup.add(g);
    pads.push({ g, mat, disc, sph, ring, big: isBig, state: true, flash: -1 });
  }
}
// État d'un pad à l'image f : initial + événements jusqu'à f (images triées).
function padStateAt(t, f, out) {
  const pp = t.pads; for (let i = 0; i < pp.active0.length; i++) out[i] = pp.active0[i];
  for (let e = 0; e < pp.events.length; e += 3) { if (pp.events[e] > f) break; out[pp.events[e + 1]] = pp.events[e + 2] === 1; }
  return out;
}
const _ps = [];
function updatePads(t, x, now) {
  if (!pads.length) return;
  const f = Math.floor(x); padStateAt(t, f, _ps);
  // ramassage dans les ~0,3 s qui précèdent : flash (anneau qui grandit)
  const lo = Math.max(0, f - Math.round(0.35 / t.dt)); let fl = {};
  const ev = t.pads.events;
  for (let e = 0; e < ev.length; e += 3) if (ev[e + 2] === 0 && ev[e] <= f && ev[e] >= lo) fl[ev[e + 1]] = (x - ev[e]) * t.dt;
  pads.forEach((p, i) => {
    const on = _ps[i];
    p.mat.color.setHex(on ? PADCOL : PADOFF); p.mat.opacity = on ? 1 : 0.45;
    p.disc.scale.y = on ? 1 : 0.5;
    if (p.sph) { p.sph.visible = on; if (on) p.sph.position.y = 130 + Math.sin(now / 350 + i) * 12; }
    const a = fl[i];
    if (a !== undefined) { const k = a / 0.35, r = (p.big ? 120 : 70) * (1 + k * 2.2); p.ring.scale.set(r, 1, r); p.ring.material.opacity = 0.9 * (1 - k); p.ring.visible = true; }
    else p.ring.visible = false;
  });
}

const _f = new THREE.Vector3(), _u = new THREE.Vector3(), _z = new THREE.Vector3(), _m = new THREE.Matrix4();
function place(obj, a, b, k, f) { // a, b : images voisines ; k : fraction ; f : décalage de la pose dans le tableau
  const g = (i, o) => a[i + o] + (b[i + o] - a[i + o]) * k;
  const pos = P(g(f, 0), g(f, 1), g(f, 2));
  _f.copy(P(g(f, 3), g(f, 4), g(f, 5))).normalize();
  _u.copy(P(g(f, 6), g(f, 7), g(f, 8))).normalize();
  _z.crossVectors(_f, _u).normalize();
  _u.crossVectors(_z, _f);
  _m.makeBasis(_f, _u, _z).setPosition(pos);
  obj.matrix.copy(_m); obj.matrixWorldNeedsUpdate = true;
  return pos;
}

/* ---------- Données ---------- */
let list = [], top = [], showTop = false, filter = '', v2only = false, newest = true, cur = null, traj = null;
const labels = m => m.replace(/_/g, ' ');
// Étiquettes d'un clip : la principale, puis les autres mécaniques validées (anciens clips : la seule principale).
const tagsOf = c => [...new Set([c.mechanic, ...(c.mechanics || []).map(l => l.mechanic)])];
const chips = c => tagsOf(c).map(m => `<span class="chip">${labels(m)}</span>`).join('') + (c.combo ? '<span class="chip combo">combo</span>' : '');
const fmtDate = u => new Date(u * 1000).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

async function loadList() {
  try {
    const r = await fetch('clips'); list = await r.json();
  } catch (e) { $('msg').textContent = 'Liste indisponible.'; return; }
  try { const r = await fetch('clips?top=1'); top = r.ok ? await r.json() : []; } catch (e) { top = []; }
  showTop = top.length > 0;
  renderList();
  const id = location.hash.slice(1);
  if (id) select(id); else if (list.length) $('list').classList.add('open');
}
function renderList() {
  const counts = {}; for (const c of list) for (const m of tagsOf(c)) counts[m] = (counts[m] || 0) + 1;
  const f = $('filters'); f.innerHTML = '';
  const mk = (key, text) => { const b = document.createElement('button'); b.textContent = text; if (!showTop && filter === key) b.className = 'on'; b.onclick = () => { showTop = false; filter = key; renderList(); }; f.appendChild(b); };
  const mkTop = () => { const b = document.createElement('button'); b.textContent = `🏆 Top ${top.length}`; if (showTop) b.className = 'on'; b.onclick = () => { showTop = true; renderList(); }; f.appendChild(b); };
  if (top.length) mkTop();
  mk('', `Tout ${list.length}`);
  for (const m of Object.keys(counts).sort((a, b) => counts[b] - counts[a])) mk(m, `${labels(m)} ${counts[m]}`);
  if (list.some(c => (c.detector || 1) < 2)) { const b = document.createElement('button'); b.textContent = 'v2 seulement'; if (v2only) b.className = 'on'; b.onclick = () => { v2only = !v2only; renderList(); }; f.appendChild(b); }
  if (showTop) {
    $('n').textContent = `Top ${top.length} · meilleurs scores, jamais évincés`;
    $('count').textContent = list.length ? `· ${list.length}` : '';
    $('sort').style.display = 'none';
    const it = $('items'); it.innerHTML = '';
    top.forEach((c, i) => {
      const q = c.quality || {};
      const d = document.createElement('div'); d.className = 'item' + (c.id === cur ? ' cur' : '');
      d.innerHTML = `<b>#${i + 1} ${labels(c.mechanic)}</b><span>${chips(c)}<br>${Math.round((q.score || 0) * 100)} % · ${Math.round(q.ball_speed_to_goal || 0)} uu/s · but : ${q.goal_3s ? 'oui' : 'non'} · ${fmtDate(c.created_unix)}</span>`;
      d.onclick = () => { location.hash = c.id; };
      it.appendChild(d);
    });
    return;
  }
  $('sort').style.display = '';
  let rows = list.filter(c => !v2only || (c.detector || 1) >= 2).filter(c => !filter || tagsOf(c).includes(filter)).sort((a, b) => (newest ? b.created_unix - a.created_unix : a.created_unix - b.created_unix));
  $('n').textContent = `${rows.length} clip${rows.length > 1 ? 's' : ''}`;
  $('count').textContent = list.length ? `· ${list.length}` : '';
  $('sort').textContent = newest ? 'Plus récents' : 'Plus anciens';
  const it = $('items'); it.innerHTML = '';
  for (const c of rows) {
    const d = document.createElement('div'); d.className = 'item' + (c.id === cur ? ' cur' : '');
    d.innerHTML = `<b>${labels(c.mechanic)}</b><span>${chips(c)}<br>${fmtDate(c.created_unix)} · ${c.seconds.toFixed(1)} s${c.detail && c.detail.value ? ` · ${Math.round(c.detail.value)} uu/s` : ''}${c.detail && c.detail.support && c.detail.support !== 'none' ? ` · ${c.detail.support}` : ''}${(c.detector || 1) < 2 ? ' · v1' : c.quality ? ` · ${Math.round(c.quality.score * 100)} %${c.quality.goal_3s ? ' · but' : ''}` : ''}</span>`;
    d.onclick = () => { location.hash = c.id; };
    it.appendChild(d);
  }
}
$('sort').onclick = () => { newest = !newest; renderList(); };
$('btnlist').onclick = () => $('list').classList.add('open');
$('close').onclick = () => $('list').classList.remove('open');

async function select(id) {
  cur = id; renderList();
  if (matchMedia('(max-width:899px)').matches) $('list').classList.remove('open');
  $('msg').style.display = 'flex'; $('msg').textContent = 'Rejeu en cours…';
  playing = false; traj = null;
  try {
    const r = await fetch(`clips/${encodeURIComponent(id)}/trajectory?hz=30`);
    if (!r.ok) throw new Error(r.status);
    const t = await r.json(); if (cur !== id) return;
    setTraj(t);
  } catch (e) { $('msg').textContent = 'Clip introuvable ou indisponible (' + e.message + ').'; }
}
addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && id !== cur) select(id); });

function setTraj(t) {
  traj = t; $('msg').style.display = 'none';
  for (const c of cars) scene.remove(c);
  cars = t.cars.map((c, i) => makeCar(c.blue, i === t.agent));
  buildPads(t);
  $('gauges').innerHTML = t.cars.map((c, i) => `<div class="gauge ${c.blue ? 'blue' : 'orange'}${i === t.agent ? ' agent' : ''}"><span>${i === t.agent ? 'Agent' : (c.blue ? 'Bleu' : 'Orange')}</span><span class="bar"><i></i></span><b></b><div class="spd"></div></div>`).join('');
  gaugeEls = [...$('gauges').children].map(d => [d.querySelector('i'), d.querySelector('b'), d.querySelector('.spd')]);
  setupExtras(t);
  if (ballPath) scene.remove(ballPath);
  const pts = []; for (let i = 0; i < t.frames; i++) pts.push(P(t.ball[i * 9], t.ball[i * 9 + 1], t.ball[i * 9 + 2]));
  ballPath = line(pts, 0xffffff, 0.35); scene.add(ballPath);
  $('title').firstChild.textContent = labels(t.mechanic) + ' ';
  $('hudl').textContent = `${fmtDate(t.created_unix)} · pas ${t.train_step}`;
  const end = (t.frames - 1) * t.dt;
  $('trig').style.left = `${(t.trigger_time / end) * 100}%`; $('trig').style.display = 'block';
  // Un repère par mécanique validée (instant de sa reconnaissance), étiquettes en puces sous le titre.
  document.querySelectorAll('#bar .mk').forEach(e => e.remove());
  for (const l of t.labels || []) { const m = document.createElement('div'); m.className = 'mk'; m.title = labels(l.mechanic); m.style.left = `${(l.t / end) * 100}%`; $('bar').appendChild(m); }
  $('hudl').title = (t.labels || []).map(l => `${l.t.toFixed(1)} s ${labels(l.mechanic)}`).join(' · ');
  $('tags').innerHTML = (t.labels || []).map(l => `<span class="chip">${labels(l.mechanic)} ${l.t.toFixed(1)} s</span>`).join('') + (t.combo ? '<span class="chip combo">combo</span>' : '');
  evs = inputEvents(t);
  for (const e of (evs && evs[t.agent]) || []) { const m = document.createElement('div'); m.className = 'mk fl'; m.title = e.txt; m.style.left = `${(e.t / end) * 100}%`; $('bar').appendChild(m); }
  time = 0; playing = true; $('play').textContent = '⏸';
  if (camMode === 'free') { orbit.target.set(0, 300, 0); camera.position.set(0, 3800, 7600); }
}

/* ---------- Vitesses (HUD) et mode avancé ---------- */
const KMH = 0.036, SUPERSONIC = 2200, GRAVITY = 650, BALL_R = 93;
let adv = false;
try { adv = localStorage.getItem('adv') === '1'; } catch (e) { /* stockage indisponible */ }
const advGroup = new THREE.Group(); scene.add(advGroup);
let A = null; // objets 3D du mode avancé pour le clip en cours
const vlen = (a, i) => Math.hypot(a[i * 3], a[i * 3 + 1], a[i * 3 + 2]);
const vlerp = (a, i, j, k, o) => { for (let c = 0; c < 3; c++) o[c] = a[i * 3 + c] + (a[j * 3 + c] - a[i * 3 + c]) * k; return o; };
const fmtSpeed = v => `<b>${Math.round(v * KMH)}</b> km/h <small>${Math.round(v).toLocaleString('fr-FR')} uu/s</small>`;
const arrow = (hex) => { const a = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), 1, hex, 100, 50); a.visible = false; advGroup.add(a); return a; };
function setArrow(a, org, v, len) {
  const m = Math.hypot(v[0], v[1], v[2]);
  if (!(len > 15) || m < 1e-6) { a.visible = false; return; }
  a.visible = true; a.position.copy(org); a.setDirection(P(v[0] / m, v[1] / m, v[2] / m));
  a.setLength(len, Math.min(len * 0.25, 130), Math.min(len * 0.12, 60));
}
function setupExtras(t) {
  while (advGroup.children.length) advGroup.remove(advGroup.children[0]);
  const hasVel = !!(t.ball_vel && t.ball_vel.length >= t.frames * 3);
  const cv = c => !!(c.vel && c.vel.length >= t.frames * 3);
  let max = 0; if (hasVel) for (let i = 0; i < t.frames; i++) max = Math.max(max, vlen(t.ball_vel, i));
  const trailN = Math.max(2, Math.round(2.5 * t.hz)), predN = 45;
  const line3 = (n, hex, op) => {
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3)); g.setDrawRange(0, 0);
    const l = new THREE.Line(g, new THREE.LineBasicMaterial({ color: hex, transparent: true, opacity: op })); l.frustumCulled = false; advGroup.add(l); return l;
  };
  const ti = Math.min(Math.round(t.trigger_time / t.dt), t.frames - 1);
  const impact = new THREE.Mesh(new THREE.TorusGeometry(130, 14, 8, 24), new THREE.MeshBasicMaterial({ color: 0xff3b6b }));
  impact.position.copy(P(t.ball[ti * 9], t.ball[ti * 9 + 1], t.ball[ti * 9 + 2])); impact.rotation.x = Math.PI / 2; advGroup.add(impact);
  A = {
    hasVel, ballMax: max, trailN, predN, impact, pos: t.cars.map(() => new THREE.Vector3()),
    trail: line3(trailN, 0xffffff, 0.8), pred: line3(predN, 0x55ffcc, 0.9),
    ballV: arrow(0xffffff),
    carV: t.cars.map(c => arrow(c.blue ? BLUE : ORANGE)), carF: t.cars.map(() => arrow(0x4cff6a)),
    carU: t.cars.map(() => arrow(0xff5cf0)), carW: t.cars.map(() => arrow(0xffe14c)),
    carHasVel: t.cars.map(cv),
  };
  $('adv').style.display = 'none';
  advGroup.visible = adv;
}
function updateExtras(t, i, j, k, x, bp) {
  const v = [0, 0, 0], o = [0, 0, 0];
  // HUD de vitesses : balle (+ max du clip) et chaque voiture, d'après les champs de la trajectoire.
  const bh = $('ballhud');
  if (A.hasVel) {
    vlerp(t.ball_vel, i, j, k, v); const sp = Math.hypot(v[0], v[1], v[2]);
    bh.innerHTML = `Balle ${fmtSpeed(sp)}<br>max ${Math.round(A.ballMax * KMH)} km/h <small>${Math.round(A.ballMax).toLocaleString('fr-FR')} uu/s</small>`;
    bh.style.display = '';
  } else bh.style.display = 'none';
  const lines = [];
  t.cars.forEach((c, n) => {
    const el = gaugeEls[n] && gaugeEls[n][2];
    let cs = 0;
    if (A.carHasVel[n]) {
      vlerp(c.vel, i, j, k, o); cs = Math.hypot(o[0], o[1], o[2]);
      if (el) el.innerHTML = `${fmtSpeed(cs)}${cs > SUPERSONIC ? ' <span class="ss">⚡ SUPERSONIQUE</span>' : ''}`;
    } else if (el) el.textContent = '';
    if (!adv) return;
    const org = A.pos[n];
    setArrow(A.carV[n], org, A.carHasVel[n] ? o : [0, 0, 0], Math.min(cs * 0.3, 2500));
    const f = c.pose.slice(i * 9 + 3, i * 9 + 6), u = c.pose.slice(i * 9 + 6, i * 9 + 9);
    setArrow(A.carF[n], org, f, 320); setArrow(A.carU[n], org, u, 220);
    if (c.ang && c.ang.length >= t.frames * 3) { const w = vlerp(c.ang, i, j, k, [0, 0, 0]); setArrow(A.carW[n], org, w, Math.min(Math.hypot(w[0], w[1], w[2]) * 60, 450)); }
    const dist = org.distanceTo(bp);
    const g = c.flags[i] & 1;
    const bo = c.boost[i];
    lines.push(`${n === t.agent ? 'Agent' : (c.blue ? 'Bleu ' : 'Orange')}: ${g ? 'sol' : 'air'} · boost ${Math.round(bo)} · balle à ${Math.round(dist)} uu`);
  });
  if (!adv) return;
  vlerp(t.ball_vel || [], i, j, k, v);
  const bv = A.hasVel ? v : [0, 0, 0];
  setArrow(A.ballV, bp, bv, Math.min(Math.hypot(bv[0], bv[1], bv[2]) * 0.3, 2500));
  lines.unshift(`Balle: hauteur ${Math.round(bp.y)} uu`);
  const panel = $('adv'); panel.textContent = lines.join('\n'); panel.style.display = 'block';
  // Traînée : les ~2,5 dernières secondes de la balle.
  const a0 = Math.max(0, i - A.trailN + 1), pos = A.trail.geometry.attributes.position;
  let n = 0;
  for (let f = a0; f <= i; f++, n++) { const q = P(t.ball[f * 9], t.ball[f * 9 + 1], t.ball[f * 9 + 2]); pos.setXYZ(n, q.x, q.y, q.z); }
  pos.needsUpdate = true; A.trail.geometry.setDrawRange(0, n);
  // Trajectoire balistique prédite (gravité, rebond au sol à 60 %, sans murs ni plafond ni voitures).
  const pp = A.pred.geometry.attributes.position;
  if (A.hasVel) {
    const r = [t.ball[i * 9] + (t.ball[j * 9] - t.ball[i * 9]) * k, t.ball[i * 9 + 1] + (t.ball[j * 9 + 1] - t.ball[i * 9 + 1]) * k, bp.y];
    let px = r[0], py = r[1], pz = r[2], vx = v[0], vy = v[1], vz = v[2];
    const h = 0.04;
    for (let s = 0; s < A.predN; s++) {
      pp.setXYZ(s, px, pz, -py);
      px += vx * h; py += vy * h; vz -= GRAVITY * h; pz += vz * h;
      if (pz < BALL_R) { pz = BALL_R; if (vz < 0) vz = -vz * 0.6; }
    }
    pp.needsUpdate = true; A.pred.geometry.setDrawRange(0, A.predN);
  } else A.pred.geometry.setDrawRange(0, 0);
}
/* ---------- Entrées du bot (mode avancé) : jauges, boutons, flips / doubles sauts synchronisés ---------- */
const FLIP_SHOW = 0.9; // durée d'affichage de l'indicateur après l'événement (s)
function dodgeLabel(c) { // c = [gaz, dir, tangage, lacet, roulis, bits] ; sens d'après les entrées (tangage - = avant)
  const [, , p, y, r] = c, dz = 0.3, parts = [];
  if (p < -dz) parts.push('avant'); else if (p > dz) parts.push('arrière');
  const lat = Math.abs(y) >= Math.abs(r) ? y : r;
  if (Math.abs(lat) > dz) parts.push(lat > 0 ? 'droite' : 'gauche');
  return parts.join('-');
}
function inputEvents(t) { // [{t, kind:'flip'|'dj'|'cancel', txt}] par voiture
  if (!t.ctl || !t.ctl_dt) return null;
  return t.ctl.map((raw, n) => {
    const out = [], fl = t.cars[n].flags, ns = Math.floor(raw.length / 6);
    for (let s = 1; s < ns; s++) {
      const c = raw.slice(s * 6, s * 6 + 6), prev = raw[(s - 1) * 6 + 5];
      if (!(c[5] & 2) || (prev & 2)) continue; // front montant du saut
      const f0 = Math.min(Math.round(s * t.ctl_dt / t.dt), t.frames - 1), f1 = Math.min(Math.round((s + 1) * t.ctl_dt / t.dt) + 1, t.frames - 1);
      if (fl[f0] & 1) continue; // saut depuis le sol : pas un dash/flip
      let flipped = false; for (let f = f0; f <= f1; f++) if (fl[f] & 8) flipped = true;
      if (!flipped && !(fl[f0] & 4)) continue;
      const d = dodgeLabel(c), time = s * t.ctl_dt;
      const stall = Math.abs(c[3]) > 0.3 && Math.abs(c[4]) > 0.3 && c[3] * c[4] < 0 && Math.abs(c[2]) < 0.3;
      if (!flipped) out.push({ t: time, kind: 'dj', txt: 'DOUBLE SAUT' });
      else if (stall) out.push({ t: time, kind: 'cancel', txt: 'FLIP ANNULÉ (lacet ≠ roulis)' });
      else out.push({ t: time, kind: 'flip', txt: 'FLIP' + (d ? ' ' + d.toUpperCase() : '') });
    }
    return out;
  });
}
const axis = v => { const w = Math.min(Math.abs(v), 1) * 50; return `<i class="${v < 0 ? 'neg' : ''}" style="${v < 0 ? 'right' : 'left'}:50%;width:${w}%"></i>`; };
const AXES = ['Gaz', 'Direction', 'Tangage', 'Lacet', 'Roulis'];
function updateInputs(t, time) {
  const box = $('inp');
  if (!adv || !t.ctl || !t.ctl_dt || !t.ctl.length) { box.style.display = 'none'; return; }
  box.style.display = 'flex';
  const order = t.cars.map((_, n) => n).sort((a, b) => (a === t.agent ? -1 : b === t.agent ? 1 : a - b));
  box.innerHTML = order.map(n => {
    const raw = t.ctl[n], ns = Math.floor(raw.length / 6), s = Math.min(Math.floor(time / t.ctl_dt + 1e-6), ns - 1), c = raw.slice(s * 6, s * 6 + 6);
    const ev = (evs && evs[n] || []).filter(e => time >= e.t && time < e.t + FLIP_SHOW).pop();
    const car = t.cars[n], bits = c[5];
    return `<div class="ip ${car.blue ? 'blue' : 'orange'}${n === t.agent ? ' agent' : ''}"><div class="nm">${n === t.agent ? 'Agent' : (car.blue ? 'Bleu' : 'Orange')} · entrées</div>`
      + AXES.map((a, q) => `<div class="r"><span>${a}</span><span class="ax">${axis(c[q])}</span><span>${c[q].toFixed(1)}</span></div>`).join('')
      + `<div class="bt"><b class="j${bits & 2 ? ' on' : ''}">SAUT</b><b class="bo${bits & 1 ? ' on' : ''}">BOOST</b><b class="hb${bits & 4 ? ' on' : ''}">DRIFT</b></div>`
      + `<div class="ev${ev ? ' ' + ev.kind : ''}">${ev ? ev.txt : '—'}</div></div>`;
  }).join('');
}
let evs = null;
function setAdv(on) {
  adv = on; $('advbtn').classList.toggle('on', on);
  try { localStorage.setItem('adv', on ? '1' : '0'); } catch (e) { /* stockage indisponible */ }
  if (A) advGroup.visible = on;
  if (!on) { $('adv').style.display = 'none'; $('inp').style.display = 'none'; }
}
$('advbtn').onclick = () => setAdv(!adv);
setAdv(adv);

/* ---------- Lecture ---------- */
let playing = false, time = 0, speed = 1, loop = true, camMode = 'free', last = performance.now(), seeking = false;
const speeds = [0.25, 0.5, 1, 1.5, 2];
$('play').onclick = () => { if (!traj) return; if (!playing && time >= (traj.frames - 1) * traj.dt - 1e-3) time = 0; playing = !playing; $('play').textContent = playing ? '⏸' : '▶'; };
$('speed').onclick = () => { speed = speeds[(speeds.indexOf(speed) + 1) % speeds.length]; $('speed').textContent = speed + '×'; };
$('loop').onclick = () => { loop = !loop; $('loop').classList.toggle('on', loop); };
$('seek').addEventListener('input', e => { if (!traj) return; seeking = true; time = e.target.value / 1000 * (traj.frames - 1) * traj.dt; });
$('seek').addEventListener('change', () => { seeking = false; });
for (const b of document.querySelectorAll('.cam')) b.onclick = () => {
  camMode = b.dataset.cam; document.querySelectorAll('.cam').forEach(x => x.classList.toggle('on', x === b));
  orbit.enabled = camMode !== 'agent';
};
$('share').onclick = async () => {
  const url = location.href;
  try { if (navigator.share) await navigator.share({ url }); else { await navigator.clipboard.writeText(url); $('share').textContent = '✓'; setTimeout(() => $('share').textContent = '🔗', 1200); } } catch (e) { prompt('Lien', url); }
};

const _bp = new THREE.Vector3(), _cp = new THREE.Vector3(), _want = new THREE.Vector3(), _look = new THREE.Vector3(), _cf = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  const w = view.clientWidth, h = view.clientHeight;
  if (renderer.domElement.width !== Math.floor(w * renderer.getPixelRatio()) || renderer.domElement.height !== Math.floor(h * renderer.getPixelRatio())) {
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  if (traj) {
    const end = (traj.frames - 1) * traj.dt;
    if (playing && !seeking) {
      time += dt * speed;
      if (time >= end) { if (loop) time = 0; else { time = end; playing = false; $('play').textContent = '▶'; } }
    }
    const x = Math.min(time / traj.dt, traj.frames - 1), i = Math.min(Math.floor(x), traj.frames - 2), k = x - i;
    _bp.copy(place(ballMesh, traj.ball.slice(i * 9, i * 9 + 9), traj.ball.slice(i * 9 + 9, i * 9 + 18), k, 0));
    ballMesh.matrixAutoUpdate = false; ballMesh.updateMatrixWorld(true);
    traj.cars.forEach((c, n) => {
      const p = place(cars[n], c.pose.slice(i * 9, i * 9 + 9), c.pose.slice(i * 9 + 9, i * 9 + 18), k, 0);
      const fi = (c.flags[i] & 2) !== 0 || (c.flags[Math.min(i + 1, traj.frames - 1)] & 2) !== 0 && k > 0.5;
      const fl = cars[n].userData.flame; fl.visible = fi;
      if (fi) { const s = 0.85 + Math.random() * 0.5; fl.scale.set(s * 1.3, 1, 1); }
      const bo = c.boost[i] + (c.boost[Math.min(i + 1, traj.frames - 1)] - c.boost[i]) * k;
      if (gaugeEls[n]) { gaugeEls[n][0].style.width = bo + '%'; gaugeEls[n][1].textContent = Math.round(bo); }
      cars[n].updateMatrixWorld(true);
      if (A) A.pos[n].copy(p);
      if (n === traj.agent) {
        _cp.copy(p); _cf.setFromMatrixColumn(cars[n].matrix, 0);
      }
    });
    if (A) updateExtras(traj, i, i + 1, k, x, _bp);
    updateInputs(traj, time);
    updatePads(traj, x, now);
    if (!seeking) $('seek').value = Math.round(time / end * 1000);
    $('time').textContent = `${time.toFixed(1)} / ${end.toFixed(1)} s`;
    if (camMode === 'ball') { orbit.target.lerp(_bp, 0.2); }
    else if (camMode === 'agent') {
      _want.copy(_cp).addScaledVector(_cf, -420).add(_look.set(0, 170, 0));
      camera.position.lerp(_want, 0.15);
      camera.lookAt(_look.copy(_cp).lerp(_bp, 0.35).add(new THREE.Vector3(0, 60, 0)));
    }
  }
  if (camMode !== 'agent') orbit.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
loadList();
</script>
