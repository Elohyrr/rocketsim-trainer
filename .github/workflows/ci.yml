name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  # RocketSim (C++20) ne compile pas avec GCC 12 : clang requis.
  CC: clang
  CXX: clang++
  # rocketsim_rs compile avec -march=native : un CPU différent à l'exécution donne SIGILL. Cible générique.
  CFLAGS: -march=x86-64-v2
  CXXFLAGS: -march=x86-64-v2
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gilrs (manette) lie libudev.
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: march-v2
      # Meshes de collision : téléchargés (jamais commités), mis en cache par empreintes + script.
      - uses: actions/cache@v4
        with:
          path: collision_meshes
          key: meshes-${{ hashFiles('scripts/fetch-meshes.sh', 'scripts/meshes.sha256') }}
      - run: scripts/fetch-meshes.sh
      - run: shellcheck scripts/install.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          ROCKETSIM_MESHES_DIR: ${{ github.workspace }}/collision_meshes
